version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# ConnectHub — Full Stack Docker Compose
#
# Services:
#   Infrastructure : mysql, redis, rabbitmq
#   Discovery      : eureka-server
#   Gateway        : api-gateway  (port 8080)
#   App Services   : auth(8081) room(8082) message(8083) presence(8084)
#                    notification(8085) media(8086) websocket(8087)
#
# Usage:
#   docker compose up --build          # first run (builds images)
#   docker compose up -d               # subsequent runs (detached)
#   docker compose down -v             # stop + remove volumes
#
# Env overrides (create a .env file in same directory):
#   MYSQL_ROOT_PASSWORD=YourPassword
#   GOOGLE_CLIENT_ID=xxx
#   GOOGLE_CLIENT_SECRET=xxx
#   AWS_ACCESS_KEY=xxx
#   AWS_SECRET_KEY=xxx
# ─────────────────────────────────────────────────────────────────────────────

networks:
  connecthub-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  media-uploads:

# ─── Reusable health-check snippets (YAML anchors) ───────────────────────────
x-mysql-healthcheck: &mysql-healthcheck
  test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-Bhumi#1705}"]
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 30s

x-service-defaults: &service-defaults
  networks:
    - connecthub-net
  restart: unless-stopped

services:

  # ══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ══════════════════════════════════════════════════════════════════════════

  mysql:
    <<: *service-defaults
    image: mysql:8.0
    container_name: connecthub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Bhumi#1705}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      <<: *mysql-healthcheck

  redis:
    <<: *service-defaults
    image: redis:7.2-alpine
    container_name: connecthub-redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:3.13-management-alpine
    container_name: connecthub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI  →  http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # SERVICE DISCOVERY
  # ══════════════════════════════════════════════════════════════════════════

  eureka-server:
    <<: *service-defaults
    build:
      context: ./eureka-server
    container_name: connecthub-eureka
    ports:
      - "8761:8761"   # Dashboard →  http://localhost:8761
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health || curl -sf http://localhost:8761/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ══════════════════════════════════════════════════════════════════════════
  # APPLICATION SERVICES
  # ══════════════════════════════════════════════════════════════════════════

  auth-service:
    <<: *service-defaults
    build:
      context: ./auth-service
    container_name: connecthub-auth
    ports:
      - "8081:8081"
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/connecthub_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Bhumi#1705}
      # Eureka
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # OAuth2
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-766466404238-f7p1i76598g8pfsd0cq44g9elhh0g511.apps.googleusercontent.com}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      # Redis — JWT token blacklist / session cache
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  room-service:
    <<: *service-defaults
    build:
      context: ./room-service
    container_name: connecthub-room
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/connecthub_room?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Bhumi#1705}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Inter-service URLs
      AUTH_SERVICE_URL: http://auth-service:8081
      MESSAGE_SERVICE_URL: http://message-service:8083
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started

  message-service:
    <<: *service-defaults
    build:
      context: ./message-service
    container_name: connecthub-message
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/connecthub_message?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Bhumi#1705}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      ROOM_SERVICE_URL: http://room-service:8082
      # Redis — recent message / room cache
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # RabbitMQ — publishes message events to notification & websocket services
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  presence-service:
    <<: *service-defaults
    build:
      context: ./presence-service
    container_name: connecthub-presence
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/connecthub_presence?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Bhumi#1705}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Redis — ready for future use or if presence caching is added
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # RabbitMQ — consumes presence events from websocket-service
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  notification-service:
    <<: *service-defaults
    build:
      context: ./notification-service
    container_name: connecthub-notification
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/connecthub_notification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Bhumi#1705}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # RabbitMQ — ready for event-driven notifications
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      # Email (optional)
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-your_email@gmail.com}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-your_app_password_here}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  media-service:
    <<: *service-defaults
    build:
      context: ./media-service
    container_name: connecthub-media
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/connecthub_media?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Bhumi#1705}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # AWS S3 (leave as-is to use local storage fallback)
      AWS_S3_ACCESS_KEY: ${AWS_ACCESS_KEY:-your_aws_access_key}
      AWS_S3_SECRET_KEY: ${AWS_SECRET_KEY:-your_aws_secret_key}
      # Local uploads directory inside the container
      MEDIA_LOCAL_UPLOAD_DIR: /app/uploads
    volumes:
      - media-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  websocket-service:
    <<: *service-defaults
    build:
      context: ./websocket-service
    container_name: connecthub-websocket
    ports:
      - "8087:8087"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Inter-service URLs (used for REST callbacks)
      MESSAGE_SERVICE_URL: http://message-service:8083
      PRESENCE_SERVICE_URL: http://presence-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      ROOM_SERVICE_URL: http://room-service:8082
      # RabbitMQ — for publishing/consuming real-time events
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      # Redis — WebSocket session / active-room tracking
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      message-service:
        condition: service_started
      presence-service:
        condition: service_started
      notification-service:
        condition: service_started

  api-gateway:
    <<: *service-defaults
    build:
      context: ./api-gateway
    container_name: connecthub-gateway
    ports:
      - "8080:8080"   # Main entry point for all clients
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Override localhost URIs in application.yml with Docker service names
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://auth-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://auth-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://room-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://message-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: http://presence-service:8084
      SPRING_CLOUD_GATEWAY_ROUTES_5_URI: http://notification-service:8085
      SPRING_CLOUD_GATEWAY_ROUTES_6_URI: http://media-service:8086
      SPRING_CLOUD_GATEWAY_ROUTES_7_URI: http://websocket-service:8087
      # Swagger aggregation route URIs
      SPRING_CLOUD_GATEWAY_ROUTES_8_URI: http://auth-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_9_URI: http://room-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_10_URI: http://message-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_11_URI: http://presence-service:8084
      SPRING_CLOUD_GATEWAY_ROUTES_12_URI: http://notification-service:8085
      SPRING_CLOUD_GATEWAY_ROUTES_13_URI: http://media-service:8086
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
      room-service:
        condition: service_started
      message-service:
        condition: service_started
      presence-service:
        condition: service_started
      notification-service:
        condition: service_started
      media-service:
        condition: service_started
      websocket-service:
        condition: service_started