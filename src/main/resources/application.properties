# ──────────────────────────────────────────────────────────────────────────────
# Server
# ──────────────────────────────────────────────────────────────────────────────
server.port=8081

# ──────────────────────────────────────────────────────────────────────────────
# Application
# ──────────────────────────────────────────────────────────────────────────────
spring.application.name=auth-service

# ──────────────────────────────────────────────────────────────────────────────
# MySQL Database
# ──────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/connecthub_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Bhumi#1705}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ──────────────────────────────────────────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ──────────────────────────────────────────────────────────────────────────────
# JWT Config
# ──────────────────────────────────────────────────────────────────────────────
jwt.secret=ConnectHubSuperSecretKeyForJWTTokenGeneration2024MustBe256BitsLong
jwt.expiration=86400000

# ──────────────────────────────────────────────────────────────────────────────
#  Swagger / SpringDoc Configuration
# ──────────────────────────────────────────────────────────────────────────────
# Swagger UI URL: http://localhost:8081/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.packages-to-scan=com.connecthub.auth

# ──────────────────────────────────────────────────────────────────────────────
# ✅ Google OAuth2 Config
#    https://console.cloud.google.com/apis/credentials
# ──────────────────────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/callback/{registrationId}

# ✅ OAuth2 Success redirect — frontend URL
# Google login ke baad user yahan jayega (token query param mein milega)
oauth2.redirect-uri=http://localhost:4200/oauth2/callback

# ──────────────────────────────────────────────────────────────────────────────
# Redis — JWT token blacklist / user session cache
# ──────────────────────────────────────────────────────────────────────────────
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=86400000

# ──────────────────────────────────────────────────────────────────────────────
# Eureka
# ──────────────────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ──────────────────────────────────────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────────────────────────────────────
logging.level.com.connecthub=DEBUG
