# Server
server.port=8087

# CORS — explicit origins required (wildcard breaks SockJS + credentials)
cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# Application name
spring.application.name=websocket-service

# JWT Secret — same as auth-service
jwt.secret=ConnectHubSuperSecretKeyForJWTTokenGeneration2024MustBe256BitsLong

# Other service URLs (REST calls only for DB mutations; broadcasts go via RabbitMQ)
message.service.url=http://localhost:8083
presence.service.url=http://localhost:8084
room.service.url=http://localhost:8082

# ─── Redis — WebSocket session / active-room tracking ────────────────────────
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# ─── RabbitMQ ────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Logging
logging.level.com.connecthub=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
