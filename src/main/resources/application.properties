# Server
server.port=8084

# Application name
spring.application.name=presence-service

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/connecthub_presence?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Bhumi#1705
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Stale session cleanup — sessions older than 60 seconds
presence.stale.threshold.seconds=60

# Logging
logging.level.com.connecthub=DEBUG

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
