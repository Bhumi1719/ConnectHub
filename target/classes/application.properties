# Server
server.port=8761

# Application name
spring.application.name=eureka-server

# Eureka config
# Ye server khud ko register nahi karega
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Eureka dashboard
eureka.server.enable-self-preservation=false

# Logging
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO
server.port=8086

# Application name
spring.application.name=media-service

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/connecthub_media?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Bhumi#1705}
server.port=8083

# Application name
spring.application.name=message-service

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/connecthub_message?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
server.port=8085

# Application name
spring.application.name=notification-service

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/connecthub_notification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Bhumi#1705
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# AWS S3 Config
# Set these to your actual AWS credentials
aws.s3.bucket-name=connecthub-media
aws.s3.region=ap-south-1
aws.s3.access-key=${AWS_S3_ACCESS_KEY:your_aws_access_key}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:your_aws_secret_key}
aws.s3.presigned-url-expiry-hours=24

# Local storage fallback (when S3 not configured)
# Files will be saved here locally
media.local.upload-dir=${MEDIA_LOCAL_UPLOAD_DIR:uploads}

# Thumbnail settings
media.thumbnail.width=300
media.thumbnail.height=300

# Swagger / SpringDoc Configuration
# Swagger UI URL: http://localhost:8086/swagger-ui/index.html
# Pagination default size
spring.data.web.pageable.default-page-size=20

# Room Service URL (to update lastMessageAt — kept as REST, lightweight PUT)
room.service.url=http://localhost:8082

# ─── Redis — recent message / room cache ─────────────────────────────────────
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
# Email Configuration (Gmail example)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App settings
notification.email.enabled=false
notification.email.from=noreply@connecthub.com

# ─── RabbitMQ ────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Enables publisher confirms (optional but recommended for reliability)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Swagger / SpringDoc Configuration
# Swagger UI URL: http://localhost:8083/swagger-ui/index.html
# Listener acknowledgement: manual ACK gives reliable processing
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Swagger / SpringDoc Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.packages-to-scan=com.connecthub.media

# CORS — allow Swagger UI and frontend to reach this service
# (The API Gateway also handles CORS globally, but this covers direct-access scenarios)
springdoc.packages-to-scan=com.connecthub.message
springdoc.packages-to-scan=com.connecthub.notification

# CORS
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.mvc.cors.allowed-headers=*

# Logging
logging.level.com.connecthub=DEBUG

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
