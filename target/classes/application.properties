# Server
server.port=8086

# Application name
spring.application.name=media-service

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/connecthub_media?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Bhumi#1705
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# AWS S3 Config
# Set these to your actual AWS credentials
aws.s3.bucket-name=connecthub-media
aws.s3.region=ap-south-1
aws.s3.access-key=your_aws_access_key
aws.s3.secret-key=your_aws_secret_key
aws.s3.presigned-url-expiry-hours=24

# Local storage fallback (when S3 not configured)
# Files will be saved here locally
media.local.upload-dir=uploads

# Thumbnail settings
media.thumbnail.width=300
media.thumbnail.height=300

# Logging
logging.level.com.connecthub=DEBUG
